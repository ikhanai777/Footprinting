[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dubizzle-scraper"
version = "0.2.0"
description = "Search, filter, analyse and export dubizzle UAE listings via its Algolia API (CLI + MCP server)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
dubizzle-scrape = "dubizzle_scraper.cli:main"
dubizzle-mcp = "dubizzle_scraper.mcp_server:main"

[tool.setuptools]
packages = ["dubizzle_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
